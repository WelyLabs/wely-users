spring.application.name=users
server.port=8082

# Shared secret of POST /profile/provision, called by the Auth0 post-login Action. Must match the
# INTERNAL_SECRET_<ENV> secret of that Action.
app.internal-secret=${INTERNAL_SECRET}

# Production/Base configuration (values injected by Kube)
spring.r2dbc.url=${DB_URL}
spring.r2dbc.username=${DB_USERNAME}
spring.r2dbc.password=${DB_PASSWORD}
spring.r2dbc.properties.sslMode=verify-full

# --- Schema migrations ---------------------------------------------------------
# Flyway applies src/main/resources/db/migration at startup, before the service takes traffic.
# Same database as above, over JDBC: Flyway has no R2DBC driver.
spring.flyway.url=${DB_JDBC_URL}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
# Deployed databases got V1 to V5 by hand before Flyway: they are recorded as V5 without
# replaying anything. An empty database still gets every migration from V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5
# Flyway builds its own connection from the URL above. Without these exclusions the JDBC
# starter it pulls in would also start a pooled DataSource and a JDBC transaction manager
# beside the R2DBC ones.
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration

# --- OAuth2 Resource Server ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI}

# The audience the token must be spent on, i.e. this API: the identifier of the Auth0 API
# (wely-api-<env>). Empty disables the check.
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCES:}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI}

# --- OAuth2 Client (Auth0 Management API) ---
# The tenant domain, e.g. dev-xxxx.eu.auth0.com: the Management API is https://<domain>/api/v2.
app.auth0.domain=${AUTH0_DOMAIN}
# The M2M application wely-users-<env>, authorized on the Management API for read:users,
# update:users, delete:users and delete:sessions. Its token is cached until shortly before it expires.
spring.security.oauth2.client.registration.auth0-management.provider=auth0
spring.security.oauth2.client.registration.auth0-management.client-id=${AUTH0_MGMT_CLIENT_ID}
spring.security.oauth2.client.registration.auth0-management.client-secret=${AUTH0_MGMT_CLIENT_SECRET}
spring.security.oauth2.client.registration.auth0-management.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.auth0-management.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.auth0.token-uri=https://${app.auth0.domain}/oauth/token

# --- Kafka broker (in the cluster, plaintext) ---
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP_SERVER}
# Confluent Cloud (dev, prod): SASL_SSL with the cluster's API key, both from Secrets. PLAINTEXT, the
# default, for the in-cluster broker of overlays/local and the integration tests. Declared here, not as
# environment variables: an environment variable cannot carry a dotted key into the binder's map.
spring.cloud.stream.kafka.binder.configuration.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.cloud.stream.kafka.binder.configuration.sasl.mechanism=PLAIN
spring.cloud.stream.kafka.binder.configuration.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username='${KAFKA_API_KEY:}' password='${KAFKA_API_SECRET:}';
spring.cloud.stream.kafka.binder.auto-create-topics=false
spring.cloud.stream.kafka.binder.auto-add-partitions=false


spring.cloud.stream.bindings.userCreated-out-0.destination=${TOPIC_PREFIX}user-created
spring.cloud.stream.bindings.userCreated-out-0.content-type=application/json
spring.cloud.stream.bindings.userCreated-out-0.producer.partition-key-expression=payload.userId
# Create the topic on the broker before deploying: the binder may not create topics.
spring.cloud.stream.bindings.userDeleted-out-0.destination=${TOPIC_PREFIX}user-deleted
spring.cloud.stream.bindings.userDeleted-out-0.content-type=application/json
spring.cloud.stream.bindings.userDeleted-out-0.producer.partition-key-expression=payload.userId
spring.cloud.stream.bindings.userModified-out-0.destination=${TOPIC_PREFIX}user-modified
spring.cloud.stream.bindings.userModified-out-0.content-type=application/json
spring.cloud.stream.bindings.userModified-out-0.producer.partition-key-expression=payload.userId
# Consumed by wely-events, which keeps one yearly birthday event per user.
spring.cloud.stream.bindings.userBirthday-out-0.destination=${TOPIC_PREFIX}user-birthday
spring.cloud.stream.bindings.userBirthday-out-0.content-type=application/json
spring.cloud.stream.bindings.userBirthday-out-0.producer.partition-key-expression=payload.userId

spring.cloud.stream.kafka.binder.producer-properties.acks=all

# --- Pictures ---------------------------------------------------------------
# wely-media, the internal service that normalizes, stores and signs pictures. Every call carries
# the shared secret wely-media knows this service by.
app.media-api.url=${MEDIA_API_URL}
app.media-api.secret=${MEDIA_API_SECRET:}
# A picture part is held in memory, not spilled to disk: the root filesystem is read-only and the
# controller refuses anything above 5 MB anyway.
spring.webflux.multipart.max-in-memory-size=6MB

# --- Social graph -----------------------------------------------------------
# wely-social, asked whether the caller is friends with a user whose profile they open. Calls
# carry the caller's own token.
app.social-api.url=${SOCIAL_API_URL}
app.social-api.timeout=5s

# --- Transactional outbox -----------------------------------------------------
# USER_CREATED is written to outbox_event with the user, then sent to Kafka by
# OutboxRelay. Table created by V2__create_outbox_event.sql. Account deletion appends
# USER_DELETED the same way, in the tombstone's transaction.
app.outbox.relay.enabled=${OUTBOX_RELAY_ENABLED:true}
app.outbox.relay.poll-interval=2s
app.outbox.relay.batch-size=100
# After this many failures an event is no longer retried (it stays in the table).
app.outbox.relay.max-attempts=5
# Published events are deleted after the retention period.
app.outbox.purge.interval=1h
app.outbox.purge.retention=7d
# wely_outbox_pending: the backlog, recounted on this period; a gauge never queries on scrape.
app.outbox.backlog.enabled=${OUTBOX_BACKLOG_ENABLED:true}
app.outbox.backlog.refresh-interval=30s

# --- Orphan users -------------------------------------------------------------
# A user whose Auth0 account does not exist is left by a sign-up Auth0 cancelled after
# wely-users created it. OrphanUserReaper deletes it (USER_DELETED).
# Column added by V3__add_identity_checked_at.sql.
app.orphan-reaper.enabled=${ORPHAN_REAPER_ENABLED:true}
app.orphan-reaper.interval=1h
# Older than any registration still in flight.
app.orphan-reaper.grace-period=15m
# Auth0's free plan rate-limits the Management API: one user checked per second, a small batch
# per pass. A 429 leaves the user for the next pass, never deletes it.
app.orphan-reaper.batch-size=50
app.orphan-reaper.pace=1s

# --- Account deletion -----------------------------------------------------------
# Off unless the deployment turns it on: DELETE /profile answers 403 USR-BUS-014 and the worker keeps finishing queued jobs.
app.account-deletion.enabled=${ACCOUNT_DELETION_ENABLED:false}
# Demo accounts that can never be deleted: comma-separated businessIds (the dev overlay lists the demo ones).
app.account-deletion.protected-user-ids=${ACCOUNT_DELETION_PROTECTED_USER_IDS:}
# DELETE /profile needs a sign-in this recent (the token's authenticatedAt claim, set by the Auth0 Action), with this much clock skew allowed.
# Thirty minutes, not five: the front has no in-page re-authentication to offer — Universal Login is a full
# redirect — so a short window sent people to Auth0 for an action they had just signed in to perform. The
# window still has to be short enough that an unattended session cannot delete the account much later.
app.account-deletion.max-auth-age=30m
app.account-deletion.allowed-clock-skew=60s
# AccountDeletionWorker: Auth0 sessions and user delete, then the avatar purge, retried with capped backoff.
app.account-deletion.retry.initial-delay=5s
app.account-deletion.retry.max-delay=1h
# The avatars are purged again this long after the deletion, to catch an upload that raced it. With the
# grace period the delay is always behind us, so the single purge that follows the tombstone closes the step.
app.account-deletion.media-settle-delay=10m
# Nothing is erased before this: the account stays whole and visible, and any sign-in cancels the deletion.
app.account-deletion.grace-period=30d
app.account-deletion.worker.enabled=${ACCOUNT_DELETION_WORKER_ENABLED:true}
app.account-deletion.worker.poll-interval=5s
app.account-deletion.worker.batch-size=20
# A claimed job is not handed to another worker before this.
app.account-deletion.worker.lease=5m
app.account-deletion.worker.alert-after-attempts=5
# Secret of GET /user-service/internal/deleted-users, distinct from app.internal-secret; blank refuses every call.
app.deleted-users.reader-secret=${DELETED_USERS_READER_SECRET:}

# com.example was a leftover from the Spring Initializr template: the package does
# not exist in this service, so the line did nothing.
logging.level.root=INFO
logging.level.com.calendar.users=INFO
logging.level.org.springframework.kafka=WARN

# No spring.webflux.problemdetails.enabled: GlobalErrorHandler is ordered first and handles
# Exception, so Boot's problem-details advice would never be consulted. Framework-raised
# errors (404, 405, 415, unreadable body) answer through GlobalErrorHandler, and failures
# outside controllers through ProblemWebExceptionHandler.

# --- Metrics ----------------------------------------------------------------
# A few fixed latency buckets for http_server_requests_seconds_bucket, not a percentile
# histogram: this runs on a Raspberry Pi, and dashboards only need these thresholds.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2500ms,5s

# --- Actuator ---------------------------------------------------------------
# Only health, info and prometheus are exposed. Everything else — env, beans,
# heapdump, loggers — stays off: those endpoints describe the internals and, on a
# cluster without a NetworkPolicy, anything inside can reach them. prometheus
# carries counters such as wely_errors_technical_total, and no user data.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Splits health into the two groups Kubernetes probes use:
#   /actuator/health/liveness  — is the process broken beyond recovery?
#   /actuator/health/readiness — should it receive traffic?
# Neither includes the database or broker indicators, and that is deliberate: a
# datastore blip would otherwise mark every pod NotReady at once, pulling the
# whole service out of the load balancer instead of degrading.
management.endpoint.health.probes.enabled=true
