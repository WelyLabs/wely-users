spring.application.name=users
server.port=8082

# Shared secret for the internal /profile/resolve endpoint called by the
# Keycloak protocol mapper. Must match the value configured on the mapper side.
app.internal-secret=${INTERNAL_SECRET}

# Production/Base configuration (values injected by Kube)
spring.r2dbc.url=${DB_URL}
spring.r2dbc.username=${DB_USERNAME}
spring.r2dbc.password=${DB_PASSWORD}
spring.r2dbc.properties.sslMode=verify-full
keycloak.realm.wely-realm.base-url=${KEYCLOAK_BASE_URL}/admin/realms/wely-realm

# --- OAuth2 Resource Server ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_INTERNAL_JWK_SET_URI}

# --- OAuth2 Client (Admin API) ---
spring.security.oauth2.client.registration.wely-users-api-client.provider=keycloak-admin-provider
spring.security.oauth2.client.registration.wely-users-api-client.client-id=wely-users-api-client
spring.security.oauth2.client.registration.wely-users-api-client.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.wely-users-api-client.authorization-grant-type=client_credentials

spring.security.oauth2.client.provider.keycloak-admin-provider.token-uri=${KEYCLOAK_INTERNAL_TOKEN_URI}
spring.security.oauth2.client.provider.keycloak-admin-provider.jwk-set-uri=${KEYCLOAK_INTERNAL_JWK_SET_URI}

# --- Kafka broker (in the cluster, plaintext) ---
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP_SERVER}
spring.cloud.stream.kafka.binder.auto-create-topics=false
spring.cloud.stream.kafka.binder.auto-add-partitions=false


spring.cloud.stream.bindings.userCreated-out-0.destination=USER_CREATED
spring.cloud.stream.bindings.userCreated-out-0.content-type=application/json
spring.cloud.stream.bindings.userCreated-out-0.producer.partition-key-expression=payload.userId
# Create the topic on the broker before deploying: the binder may not create topics.
spring.cloud.stream.bindings.userDeleted-out-0.destination=USER_DELETED
spring.cloud.stream.bindings.userDeleted-out-0.content-type=application/json
spring.cloud.stream.bindings.userDeleted-out-0.producer.partition-key-expression=payload.userId
spring.cloud.stream.bindings.userModified-out-0.destination=USER_MODIFIED
spring.cloud.stream.bindings.userModified-out-0.content-type=application/json
spring.cloud.stream.bindings.userModified-out-0.producer.partition-key-expression=payload.userId

spring.cloud.stream.kafka.binder.producer-properties.acks=all

# --- Pictures ---------------------------------------------------------------
# Garage in the cluster, through the S3 API. Uploads use the internal Service; signed URLs are
# computed for the public hostname, since a signature covers the host. The keys are Garage keys
# scoped to this one bucket.
app.media.internal-endpoint=${MEDIA_INTERNAL_ENDPOINT}
app.media.public-endpoint=${MEDIA_PUBLIC_ENDPOINT}
app.media.region=${MEDIA_REGION:garage}
app.media.bucket=${MEDIA_BUCKET:wely-avatars}
app.media.access-key=${MEDIA_ACCESS_KEY}
app.media.secret-key=${MEDIA_SECRET_KEY}
# A picture part is held in memory, not spilled to disk: the root filesystem is read-only and the
# controller refuses anything above 5 MB anyway.
spring.webflux.multipart.max-in-memory-size=6MB

# --- Transactional outbox -----------------------------------------------------
# USER_CREATED is written to outbox_event with the user, then sent to Kafka by
# OutboxRelay. Requires db/migration/V2__create_outbox_event.sql.
app.outbox.relay.enabled=${OUTBOX_RELAY_ENABLED:true}
app.outbox.relay.poll-interval=2s
app.outbox.relay.batch-size=100
# After this many failures an event is no longer retried (it stays in the table).
app.outbox.relay.max-attempts=5
# Published events are deleted after the retention period.
app.outbox.purge.interval=1h
app.outbox.purge.retention=7d

# --- Orphan users -------------------------------------------------------------
# A user whose Keycloak account does not exist is left by a registration Keycloak
# cancelled after wely-users created it. OrphanUserReaper deletes it (USER_DELETED).
# Requires db/migration/V3__add_identity_checked_at.sql.
app.orphan-reaper.enabled=${ORPHAN_REAPER_ENABLED:true}
app.orphan-reaper.interval=1h
# Older than any registration still in flight.
app.orphan-reaper.grace-period=15m
app.orphan-reaper.batch-size=100

# com.example was a leftover from the Spring Initializr template: the package does
# not exist in this service, so the line did nothing.
logging.level.root=INFO
logging.level.com.calendar.users=INFO
logging.level.org.springframework.kafka=WARN

# Framework-raised errors (405, 415, unreadable body…) answer in the same RFC 7807
# shape as the ones GlobalErrorHandler produces, instead of Spring's default body.
spring.webflux.problemdetails.enabled=true

# --- Actuator ---------------------------------------------------------------
# Only health and info are exposed. Everything else — env, beans, heapdump,
# loggers — stays off: those endpoints describe the internals and, on a cluster
# without a NetworkPolicy, anything inside can reach them.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Splits health into the two groups Kubernetes probes use:
#   /actuator/health/liveness  — is the process broken beyond recovery?
#   /actuator/health/readiness — should it receive traffic?
# Neither includes the database or broker indicators, and that is deliberate: a
# datastore blip would otherwise mark every pod NotReady at once, pulling the
# whole service out of the load balancer instead of degrading.
management.endpoint.health.probes.enabled=true
