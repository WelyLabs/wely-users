# Placeholder values so the Spring context can start without external services.
spring.application.name=users-test
server.port=0

spring.r2dbc.url=r2dbc:postgresql://localhost:5432/users-test
spring.r2dbc.username=test
spring.r2dbc.password=test

app.internal-secret=test-internal-secret
keycloak.realm.wely-realm.base-url=http://localhost:9999/admin/realms/wely-realm

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9999/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/realms/test/protocol/openid-connect/certs

spring.security.oauth2.client.registration.wely-users-api-client.provider=keycloak-admin-provider
spring.security.oauth2.client.registration.wely-users-api-client.client-id=wely-users-api-client
spring.security.oauth2.client.registration.wely-users-api-client.client-secret=test-client-secret
spring.security.oauth2.client.registration.wely-users-api-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak-admin-provider.token-uri=http://localhost:9999/realms/test/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak-admin-provider.jwk-set-uri=http://localhost:9999/realms/test/protocol/openid-connect/certs

# Kafka: the test binder must neither create topics nor reach a broker.
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.kafka.binder.auto-create-topics=false
spring.cloud.stream.bindings.userCreated-out-0.destination=USER_CREATED

logging.level.root=WARN
