# Development profile for local testing.
#
# No literal credentials, even here. This file is committed to a public repository, and the
# value that used to sit on the r2dbc.password line was a real one — the purge of the committed
# secrets missed it. Override through the environment when a local database needs something
# other than the default.
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/neondb
spring.r2dbc.username=postgres
spring.r2dbc.password=${DB_PASSWORD:postgres}
spring.flyway.url=jdbc:postgresql://localhost:5432/neondb
spring.flyway.user=postgres
spring.flyway.password=${DB_PASSWORD:postgres}
keycloak.realm.wely-realm.base-url=http://localhost:8080/admin/realms/wely-realm
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/wely-realm
spring.security.oauth2.client.provider.keycloak-admin-provider.issuer-uri=http://localhost:8080/realms/wely-realm
spring.cloud.stream.kafka.binder.brokers=localhost:9092

# Production injects INTERNAL_SECRET from a sealed secret; this default is for a workstation.
app.internal-secret=${INTERNAL_SECRET:local-dev-only}

# The dev profile may be verbose: it only ever runs on a workstation.
logging.level.com.calendar.users=DEBUG

# A wely-media running on the workstation.
app.media-api.url=${MEDIA_API_URL:http://localhost:8085}

# A wely-social running on the workstation.
app.social-api.url=${SOCIAL_API_URL:http://localhost:8083}

# is what separates them. No default in application.properties on purpose — a service
# that cannot name its topic must not start rather than join another environment's traffic.

# One broker serves every environment and the prefix is what separates them, so a single variable
# carries it: dev., prod., test. No default on purpose — a service that cannot name its topics must
# refuse to start rather than join another environment's traffic.
TOPIC_PREFIX=dev.
