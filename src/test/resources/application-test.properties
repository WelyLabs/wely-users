# Placeholder values so the Spring context can start without external services.
spring.application.name=users-test
server.port=0

spring.r2dbc.url=r2dbc:postgresql://localhost:5432/users-test
spring.r2dbc.username=test
spring.r2dbc.password=test
# Off for contexts without a database. The integration tests turn it on against their container.
spring.flyway.enabled=false
spring.flyway.url=jdbc:postgresql://localhost:5432/users-test
spring.flyway.user=test
spring.flyway.password=test

app.internal-secret=test-internal-secret
app.auth0.domain=localhost:9999

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9999/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/realms/test/protocol/openid-connect/certs

spring.security.oauth2.client.registration.auth0-management.provider=auth0
spring.security.oauth2.client.registration.auth0-management.client-id=wely-users-test
spring.security.oauth2.client.registration.auth0-management.client-secret=test-client-secret
spring.security.oauth2.client.registration.auth0-management.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.auth0-management.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.auth0.token-uri=http://localhost:9999/oauth/token

# Kafka: the test binder must neither create topics nor reach a broker.
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.kafka.binder.auto-create-topics=false
spring.cloud.stream.bindings.userCreated-out-0.destination=USER_CREATED
spring.cloud.stream.bindings.userModified-out-0.destination=USER_MODIFIED

# Otherwise the relay starts with every @SpringBootTest context and polls a database
# that is not there, twice a second, for the length of the build. OutboxRelayTest
# builds its own instance with mocks instead of relying on the context.
app.outbox.relay.enabled=false
app.outbox.backlog.enabled=false
app.orphan-reaper.enabled=false
app.account-deletion.worker.enabled=false

# Account deletion: switched on, one protected id and a reader secret distinct from app.internal-secret.
app.account-deletion.enabled=true
app.account-deletion.protected-user-ids=00000000-0000-4000-8000-000000000001
app.deleted-users.reader-secret=test-reader-secret

logging.level.root=WARN

# wely-media: nothing is contacted until a picture is stored or signed.
app.media-api.url=http://localhost:8085
app.media-api.secret=test-media-secret

# wely-social: nothing is contacted until a friend's profile is opened.
app.social-api.url=http://localhost:8083

# is what separates them. No default in application.properties on purpose — a service
# that cannot name its topic must not start rather than join another environment's traffic.

# One broker serves every environment and the prefix is what separates them, so a single variable
# carries it: dev., prod., test. No default on purpose — a service that cannot name its topics must
# refuse to start rather than join another environment's traffic.
TOPIC_PREFIX=test.
